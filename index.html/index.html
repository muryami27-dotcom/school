<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="menu" class="screen">
    <h1 class="chto-eta">Вітаю! На цьому сайті ви побачите картки персонажів, яких ми будемо вивчати у дев'ятому класі, по українській та зарубіжній літературі!</h1>
    <h2 class="opisatsa">З часом буде додаватися все більше інформації та карток</h2>
    <h5 class="vladeltsa">Сайт зроблено А. Гришиною</h5>
    <button class="foreign" onclick="showScreen('zarub')">Зарубіжна література</button>
    <button class="ukranian" onclick="showScreen('ukr-lit')">Українська література</button>
</div>

<div id="zarub" class="screen hidden">

    <button class="arrow left" onclick="previousSlide()">←</button>

    <div class="slide">
        <h1 id="slideTitle">Гуллівер</h1>

        <img id="slideImage" class="slideImage"
             src="photo/ChatGPT Image 22 сент. 2026 г., 17_18_11.png">

        <p id="slideText">
            Зоображення зроблено ChatGPT.
        </p>
    </div>

    <button class="arrow right" onclick="nextSlide()">→</button>

    <button class="domoi" onclick="showScreen('menu')">
        Повернутися на головну сторінку
    </button>

</div>

<div id="ukr-lit" class="screen hidden">
    <h2 class="ne">Поки тут нічого немає!</h2>
    <button class="damoi" onclick="showScreen('menu')">Повернутися на головну сторінку</button>
</div>

<script>
    let clickCount = 0;

    function showScreen(screenId) {
        clickCount = 0;
        console.log("Счётчик обнулен для экрана " + screenId);

        const allScreens = document.querySelectorAll('.screen');

        allScreens.forEach(screen => {
            screen.classList.add('hidden');
        });

        const targetScreen = document.getElementById(screenId);

        if (targetScreen) {
            targetScreen.classList.remove('hidden');
        }
    }


    const slides = [
        {
            title: "Гуллівер",
            image: "photo/ChatGPT Image 22 сент. 2026 г., 17_18_11.png",
            text: "Зображення зроблено ChatGPT."
        },

        {
            title: "Подорож до Ліліпутії",
            image: "photo/liliputik.jpg",
            text: "Зображення зроблено Gemini."
        },

        {
            title: "Ліліпути",
            image: "photo/liliputy.jpg",
            text: "Зображення зроблено Gemini."
        }
    ];


    let currentSlide = 0;

    let slideTimeout;


    function updateSlide() {

        const title = document.getElementById("slideTitle");
        const image = document.getElementById("slideImage");
        const text = document.getElementById("slideText");

        if (!title || !image || !text) {
            console.error("Не знайдено елемент слайдера!");
            return;
        }

        clearTimeout(slideTimeout);

        title.classList.add("fade");
        image.classList.add("fade");
        text.classList.add("fade");


        slideTimeout = setTimeout(() => {

            title.textContent = slides[currentSlide].title;
            image.src = slides[currentSlide].image;
            text.textContent = slides[currentSlide].text;

            title.classList.remove("fade");
            image.classList.remove("fade");
            text.classList.remove("fade");

        }, 300);
    }


    function nextSlide() {

        currentSlide++;

        if (currentSlide >= slides.length) {
            currentSlide = 0;
        }

        updateSlide();
    }


    function previousSlide() {

        currentSlide--;

        if (currentSlide < 0) {
            currentSlide = slides.length - 1;
        }

        updateSlide();
    }


    updateSlide();

</script>

</body>
</html>
